name: Android build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: curl -L -o bob.jar https://github.com/defold/defold/releases/download/VERSION/bob.jar
      - run: java -jar bob.jar --platform arm64-android --architectures arm64-v8a --bundle-format apk --variant release --archive --bundle-output build/android resolve build bundle
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: build/android }
